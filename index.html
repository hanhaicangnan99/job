<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta name="theme-color" content="#16324f">

<link rel="manifest" href="./manifest.webmanifest">

<meta name="mobile-web-app-capable" content="yes">

      <button class="btn-install" hidden>安装到桌面</button>
